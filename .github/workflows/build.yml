name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so the release is a preview that can't be updated in place. See README, 'Signing key'."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk lights-out.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lights-out-apk
          path: lights-out.apk

      # Releases are what you and your friend install from (directly or via Obtainium).
      # Releases give a direct APK link that works on a phone without a GitHub login:
      # https://github.com/<owner>/<repo>/releases/latest/download/lights-out.apk
      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lights Out 0.1.${{ github.run_number }}${{ steps.signing.outputs.signed != 'true' && ' (preview)' || '' }}
          target_commitish: ${{ github.sha }}
          files: lights-out.apk
          body: ${{ steps.signing.outputs.signed == 'true' && 'Signed build. Installs over earlier signed builds.' || 'Preview build signed with a throwaway key: to install a later build you must uninstall this one first, which deletes your nights. Add the signing secrets (see README) before the challenge starts.' }}
